{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-framework.fullname" . }}-secrets
  labels:
    {{- include "agentic-framework.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := .Values.secrets.data }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- else }}
# This SecretProviderClass is used when secrets.create is false.
# It integrates with the CSI Secrets Store driver to fetch secrets from a cloud provider's
# secret manager (e.g., Azure Key Vault, AWS Secrets Manager) and mount them as a K8s secret.
apiVersion: secrets-store.csi.k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "agentic-framework.fullname" . }}-secret-provider
spec:
  provider: {{ .Values.secrets.csi.provider | required "secrets.csi.provider must be set (e.g., 'azure', 'aws', 'gcp')" }}
  parameters:
    {{- toYaml .Values.secrets.csi.parameters | nindent 4 }}
  secretObjects:
  - secretName: {{ .Values.secrets.existingSecretName }}
    type: Opaque
    data:
      {{- range .Values.secrets.csi.secretObjects }}
      - key: {{ .key }}
        objectName: {{ .objectName }}
      {{- end }}
{{- end }}