# Slurm HPC Example Stack for ADEPT
# 8 services: 6 Slurm backend + MCP server + nginx proxy
#
# Usage:
#   cd examples/slurm_hpc
#   make setup   # Build, start, bootstrap JWT, register tools
#
# Architecture:
#   mysql → slurmdbd → slurmctld → slurmrestd (internal REST API)
#                    → c1, c2 (compute nodes)
#   slurm_mcp_server (dual-homed: backend + ADEPT networks)
#   slurm_nginx_proxy (ADEPT network only, reverse proxy to MCP)

services:
  # ============================================================================
  # Slurm Backend Services
  # ============================================================================

  mysql:
    image: mariadb:11
    container_name: slurm_mysql
    hostname: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-slurm_acct_db}
      MYSQL_USER: ${MYSQL_USER:-slurm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - var_lib_mysql:/var/lib/mysql
    networks:
      - slurm_backend_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  slurmdbd:
    image: slurm-hpc:${SLURM_VERSION:-25.11.2}
    build:
      context: ./slurm_backend
      args:
        SLURM_VERSION: ${SLURM_VERSION:-25.11.2}
    container_name: slurmdbd
    command: ["slurmdbd"]
    hostname: slurmdbd
    environment:
      MYSQL_USER: ${MYSQL_USER:-slurm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
    networks:
      - slurm_backend_network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  slurmctld:
    image: slurm-hpc:${SLURM_VERSION:-25.11.2}
    container_name: slurmctld
    command: ["slurmctld"]
    hostname: slurmctld
    privileged: true
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
    networks:
      - slurm_backend_network
    depends_on:
      - slurmdbd
    healthcheck:
      test: ["CMD", "bash", "-c", "scontrol ping 2>/dev/null | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  slurmrestd:
    image: slurm-hpc:${SLURM_VERSION:-25.11.2}
    container_name: slurmrestd
    command: ["slurmrestd"]
    hostname: slurmrestd
    ipc: host
    cap_add:
      - SYS_ADMIN
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
    networks:
      - slurm_backend_network
    # Port 6820 is NOT exposed to host — only accessible within slurm_backend_network
    depends_on:
      slurmctld:
        condition: service_healthy
    restart: unless-stopped

  c1:
    image: slurm-hpc:${SLURM_VERSION:-25.11.2}
    container_name: c1
    command: ["slurmd"]
    hostname: c1
    privileged: true
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
    networks:
      - slurm_backend_network
    depends_on:
      slurmctld:
        condition: service_healthy
    restart: unless-stopped

  c2:
    image: slurm-hpc:${SLURM_VERSION:-25.11.2}
    container_name: c2
    command: ["slurmd"]
    hostname: c2
    privileged: true
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
    networks:
      - slurm_backend_network
    depends_on:
      slurmctld:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # MCP Server (dual-homed: backend + ADEPT networks)
  # ============================================================================

  slurm_mcp_server:
    image: slurm-mcp:latest
    build:
      context: ./slurm_mcp_server
    container_name: slurm_mcp_server
    hostname: slurm_mcp_server
    # Uncomment to run as host user — avoids SSH key permission issues when keys
    # are bind-mounted from the host (owned by UID != container's mcpuser/999).
    # user: "${SLURM_MCP_UID:-1000}:${SLURM_MCP_GID:-1000}"
    labels:
      spiffe.workload: "slurm-mcp-server"
    ports:
      - "${SLURM_MCP_PORT:-8002}:8002"
    environment:
      - SLURM_API_URL=${SLURM_API_URL:-http://slurmrestd:6820}
      - SLURM_API_VERSION=${SLURM_API_VERSION:-v0.0.41}
      - SLURM_JWT_KEY=${SLURM_JWT_KEY:-}
      - SLURM_SERVICE_JWT=${SLURM_SERVICE_JWT:-}
      - SLURM_SERVICE_USER=${SLURM_SERVICE_USER:-root}
      - SLURM_VERIFY_SSL=false
      - SLURM_TIMEOUT=${SLURM_TIMEOUT:-30}
      - TAHOMA_PASSWORD=${TAHOMA_PASSWORD:-}
      - SPIFFE_ENABLED=${SPIFFE_ENABLED:-false}
      - SPIFFE_ENDPOINT_SOCKET=unix:///run/spire/sockets/agent.sock
      - SHARED_UPLOAD_DIR=/app/data/uploaded_files
      - SLURM_WORKSPACE=/data
      - SLURM_MCP_LOG_LEVEL=${SLURM_MCP_LOG_LEVEL:-DEBUG}
    volumes:
      - slurm_spire_agent_socket:/run/spire/sockets:ro
      - slurm_jobdir:/data
      - shared_uploads:/app/data/uploaded_files:ro
      - ../../data/containers:/app/containers:ro
      - ./ssh_keys:/app/.ssh:rw
      - ./demos:/app/demos:ro
    networks:
      - slurm_backend_network
      - adept_application_network
    depends_on:
      - slurmrestd
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================================================
  # Nginx Reverse Proxy (ADEPT network only)
  # ============================================================================

  slurm_nginx_proxy:
    image: nginx:alpine
    container_name: slurm_nginx_proxy
    hostname: slurm_nginx_proxy
    ports:
      - "${SLURM_PROXY_PORT:-9820}:80"
      - "${SLURM_PROXY_HTTPS_PORT:-9821}:443"
    volumes:
      - ./slurm_proxy.conf.template:/tmp/slurm_proxy.conf.template:ro
      - ./slurm_proxy_oidc.conf.template:/tmp/slurm_proxy_oidc.conf.template:ro
      - ./certs:/etc/nginx/ssl:ro
    environment:
      - MCP_SERVER_HOST=slurm_mcp_server
      - MCP_SERVER_PORT=8002
      - SLURM_OIDC_ENABLED=${SLURM_OIDC_ENABLED:-false}
    command: >
      /bin/sh -c "
      if [ \"$$SLURM_OIDC_ENABLED\" = 'true' ]; then
        TEMPLATE=/tmp/slurm_proxy_oidc.conf.template;
        echo '[slurm-proxy] OIDC mode enabled';
      else
        TEMPLATE=/tmp/slurm_proxy.conf.template;
        echo '[slurm-proxy] Standard mode (no OIDC)';
      fi
      && envsubst '$$MCP_SERVER_HOST $$MCP_SERVER_PORT'
      < $$TEMPLATE
      > /etc/nginx/conf.d/default.conf
      && if [ -f /etc/nginx/ssl/slurm.crt ] && [ -f /etc/nginx/ssl/slurm.key ]; then
        sed -i '/listen 80;/a\\    listen 443 ssl;\\n    ssl_certificate /etc/nginx/ssl/slurm.crt;\\n    ssl_certificate_key /etc/nginx/ssl/slurm.key;\\n    ssl_protocols TLSv1.2 TLSv1.3;\\n    ssl_prefer_server_ciphers on;' /etc/nginx/conf.d/default.conf;
        echo '[slurm-proxy] TLS enabled (certs found)';
      else
        echo '[slurm-proxy] HTTP-only mode (no certs)';
      fi
      && nginx -g 'daemon off;'"
    networks:
      - adept_application_network
    depends_on:
      slurm_mcp_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ============================================================================
  # OAuth2 Proxy for OIDC Authentication (opt-in: docker compose --profile oidc up)
  # ============================================================================

  slurm_oauth2_proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: slurm_oauth2_proxy
    hostname: slurm_oauth2_proxy
    profiles: ["oidc"]
    environment:
      - OAUTH2_PROXY_PROVIDER=keycloak-oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=${SLURM_OIDC_ISSUER_URL:-http://keycloak:8180/realms/master}
      - OAUTH2_PROXY_CLIENT_ID=${SLURM_OIDC_CLIENT_ID:-slurm-hpc-client}
      - OAUTH2_PROXY_CLIENT_SECRET=${SLURM_OIDC_CLIENT_SECRET:-}
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_UPSTREAMS=static://200
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_PASS_ACCESS_TOKEN=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_PASS_USER_HEADERS=true
      - OAUTH2_PROXY_COOKIE_SECRET=${SLURM_OIDC_COOKIE_SECRET:-0123456789abcdef0123456789abcdef}
      - OAUTH2_PROXY_COOKIE_SECURE=false
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS=true
      - OAUTH2_PROXY_OIDC_EMAIL_CLAIM=preferred_username
      - OAUTH2_PROXY_OIDC_GROUPS_CLAIM=groups
    networks:
      - adept_application_network
    depends_on:
      slurm_nginx_proxy:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # SPIFFE/SPIRE Workload Identity (opt-in: docker compose --profile spire up)
  # ============================================================================

  slurm_spire_server:
    image: ghcr.io/spiffe/spire-server:1.11.3
    container_name: slurm_spire_server
    hostname: slurm_spire_server
    profiles: ["spire"]
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/server.conf:/opt/spire/conf/server/server.conf:ro
      - ./spire/registration-entries.sh:/opt/spire/conf/registration-entries.sh:ro
      - slurm_spire_server_data:/opt/spire/data/server
    networks:
      - slurm_backend_network
    healthcheck:
      test: ["/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  slurm_spire_agent:
    image: ghcr.io/spiffe/spire-agent:1.11.3
    container_name: slurm_spire_agent
    hostname: slurm_spire_agent
    profiles: ["spire"]
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    depends_on:
      slurm_spire_server:
        condition: service_healthy
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - slurm_spire_agent_socket:/run/spire/sockets
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - slurm_backend_network
    restart: unless-stopped

  # ============================================================================
  # ADEPT SPIRE Server + Agent (opt-in: docker compose --profile federation up)
  # For bidirectional trust bundle federation between pnnl.adept and pnnl.adept.slurm
  # ============================================================================

  adept_spire_server:
    image: ghcr.io/spiffe/spire-server:1.11.3
    container_name: adept_spire_server
    hostname: adept_spire_server
    profiles: ["federation"]
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/adept_server.conf:/opt/spire/conf/server/server.conf:ro
      - ./spire/adept_registration_entries.sh:/opt/spire/conf/registration-entries.sh:ro
      - adept_spire_server_data:/opt/spire/data/server
    networks:
      - slurm_backend_network
      - adept_application_network
    healthcheck:
      test: ["/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  adept_spire_agent:
    image: ghcr.io/spiffe/spire-agent:1.11.3
    container_name: adept_spire_agent
    hostname: adept_spire_agent
    profiles: ["federation"]
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    depends_on:
      adept_spire_server:
        condition: service_healthy
    volumes:
      - ./spire/adept_agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - adept_spire_agent_socket:/run/spire/sockets
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - slurm_backend_network
      - adept_application_network
    restart: unless-stopped

# ============================================================================
# Volumes
# ============================================================================

volumes:
  etc_munge:
  etc_slurm:
  var_lib_mysql:
  var_log_slurm:
  slurm_jobdir:
    driver: local
    driver_opts:
      type: bind
      o: bind
      device: ../../data/slurm_workspace
  shared_uploads:
    external: true
    name: docker-compose_shared_uploads
  slurm_spire_server_data:
  slurm_spire_agent_socket:
  adept_spire_server_data:
  adept_spire_agent_socket:

# ============================================================================
# Networks
# ============================================================================

networks:
  slurm_backend_network:
    driver: bridge
  adept_application_network:
    external: true
