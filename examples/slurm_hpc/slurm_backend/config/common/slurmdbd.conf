#
# slurmdbd.conf — Slurm Database Daemon configuration
#
# Authentication info
AuthType=auth/munge

# slurmDBD info
DbdAddr=slurmdbd
DbdHost=slurmdbd
SlurmUser=slurm
DebugLevel=4
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/var/run/slurm/slurmdbd.pid

# Database info (env vars substituted at runtime by docker-entrypoint.sh)
StorageType=accounting_storage/mysql
StorageHost=mysql
StorageUser=${MYSQL_USER}
StoragePass=${MYSQL_PASSWORD}
StorageLoc=slurm_acct_db

# JWT as alternative authentication type
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt_hs256.key
