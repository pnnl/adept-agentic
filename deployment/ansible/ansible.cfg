[defaults]
# Ansible configuration for ADEPT multi-cloud deployment

# Inventory configuration
inventory = inventory/dev/hosts.yml
host_key_checking = False

# Output configuration
stdout_callback = yaml
bin_ansible_callbacks = True

# Connection settings
timeout = 30
forks = 5

# Privilege escalation
become = False

# Logging
log_path = /tmp/ansible-adept.log

# Role paths
roles_path = roles

# Vault configuration (use --vault-password-file at runtime)
vault_password_file = ~/.ansible-vault-password

# Retry configuration
retry_files_enabled = True
retry_files_save_path = /tmp/

# Display settings
display_skipped_hosts = False
display_ok_hosts = True
deprecation_warnings = False

# Gathering
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

[colors]
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
