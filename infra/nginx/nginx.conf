# NGINX main configuration for Agentic Framework Public Proxy
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format — includes ADEPT observability headers for cross-client correlation
    # X-Client-Source: identifies client type (claude-desktop-connector, streamlit-v2, openwebui, curl)
    # X-Connector-Instance-ID: stable UUID per connector process (one Claude Desktop session)
    # X-Request-ID: unique UUID per request for trace correlation
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'src=$http_x_client_source inst=$http_x_connector_instance_id rid=$http_x_request_id';

    access_log /var/log/nginx/access.log main;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Redirect behavior configuration (enables port-forwarded access)
    server_name_in_redirect off;  # Don't substitute server_name in redirects
    absolute_redirect off;        # Use relative redirects when possible
    port_in_redirect on;          # Include port in redirect URLs

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://$host wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Rate limiting (increased watermarks for better performance)
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;

    # Upstream definitions
    upstream keycloak {
        server keycloak:8180;
        keepalive 32;
    }

    upstream agent_gateway {
        server agent_gateway:8081;
        keepalive 32;
    }

    upstream orchestration_service {
        server orchestration_service:8084;
        keepalive 32;
    }

    upstream streamlit_app_v2 {
        server streamlit_app_v2:8503;
        keepalive 32;
    }

    upstream agent_gateway_mgmt_ui {
        server agent_gateway_mgmt_ui:8502;
        keepalive 32;
    }

    upstream jupyterlab {
        server jupyterlab:8888;
        keepalive 32;
    }

    upstream n8n {
        server n8n:5678;
        keepalive 32;
    }

    upstream openwebui {
        server openwebui:8080;
        keepalive 32;
    }

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}