# SPIRE Server for main ADEPT trust domain (pnnl.adept)
# This server represents the ADEPT orchestration side of the federation.
# In production, this would be a separate deployment; here it runs as a
# profile-gated sidecar for local development and testing.

server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "pnnl.adept"
    data_dir = "/opt/spire/data/server"
    log_level = "INFO"
    ca_ttl = "24h"
    default_x509_svid_ttl = "1h"
    default_jwt_svid_ttl = "5m"

    # Federation: expose this server's trust bundle to peers
    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port = 8443
        }
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }

    BundlePublisher "disk" {
        plugin_data {
            path = "/opt/spire/data/server/bundle.pem"
        }
    }
}
