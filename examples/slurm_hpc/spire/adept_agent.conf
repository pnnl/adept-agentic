# SPIRE Agent for main ADEPT trust domain (pnnl.adept)
# Connects to adept_spire_server. In production, this would run on the
# ADEPT orchestration host; here it's a profile-gated sidecar.

agent {
    data_dir = "/opt/spire/data/agent"
    log_level = "INFO"
    server_address = "adept_spire_server"
    server_port = "8081"
    socket_path = "/run/spire/sockets/agent.sock"
    trust_domain = "pnnl.adept"
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }
    WorkloadAttestor "docker" {
        plugin_data {
            docker_socket_path = "/var/run/docker.sock"
        }
    }
    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/data/agent"
        }
    }
}
