# Conda environment specification for chemistry/cheminformatics stack
# Installed into /opt/conda/envs/chem in Dockerfile.sandbox
# Pinned to exact versions for supply chain security (#104)
#
# Why conda? rdkit-pypi on PyPI maxes at 2022.9.5 (NumPy 1.x only).
# conda-forge has modern RDKit (2024.09+) compiled for NumPy 2.x.
# MDAnalysis also lives here because it hard-imports rdkit at module level.

name: chem
channels:
  - conda-forge
dependencies:
  - python=3.11

  # --- Chemistry / Cheminformatics ---
  - rdkit>=2024.03
  - openbabel>=3.1

  # --- Molecular Dynamics ---
  - mdanalysis>=2.7

  # --- Bioinformatics parsing ---
  - biopython>=1.83

  # --- Core scientific stack (must match versions used by rdkit/mdanalysis) ---
  - numpy>=2.0,<3
  - scipy>=1.12
  - pandas>=2.0
  - matplotlib>=3.8
  - pillow>=10.0
