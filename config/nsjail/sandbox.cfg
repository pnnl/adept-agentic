# nsjail configuration for ADEPT sandbox_mcp_server
# Seccomp-BPF + namespace isolation for scientific Python workloads
# Reference: https://github.com/google/nsjail/blob/master/config.proto

name: "adept-sandbox"
description: "Scientific Python sandbox with seccomp-bpf syscall filtering"

mode: ONCE
hostname: "sandbox"
cwd: "/workspace"

# Time limit — backup for asyncio timeout (which is the primary control)
time_limit: 300

# Resource limits (defense-in-depth, asyncio + RLIMIT_AS are primary)
rlimit_as_type: SOFT
rlimit_cpu_type: SOFT
rlimit_fsize_type: SOFT
rlimit_nofile: 1024

# UID/GID mapping: run jailed process as nobody (65534)
uidmap {
    inside_id: "65534"
    outside_id: ""
    count: 1
}
gidmap {
    inside_id: "65534"
    outside_id: ""
    count: 1
}

# Namespace configuration
# NOTE: clone_newuser=false because host has user.max_user_namespaces=0.
# Container runs privileged with CAP_SYS_ADMIN, so root can create other namespaces directly.
clone_newnet: false    # Inherit parent network (nftables handles egress)
clone_newuser: false   # Disabled — host kernel blocks user namespaces (sysctl=0)
clone_newns: true      # Mount namespace for filesystem isolation
clone_newpid: true     # PID namespace (cannot see host processes)
clone_newipc: true     # IPC namespace isolation
clone_newuts: true     # UTS namespace (isolated hostname)
clone_newcgroup: false # Share cgroup (resource limits via Docker)

# Keep capabilities needed to set up namespaces, drop all after exec
keep_caps: false
skip_setsid: false

# Mount configuration — minimal attack surface
# /app/.venv: Python interpreter and all scientific packages (read-only)
mount {
    src: "/app/.venv"
    dst: "/app/.venv"
    is_bind: true
    rw: false
    mandatory: true
}

# /opt/conda: Conda chemistry environment (read-only)
mount {
    src: "/opt/conda"
    dst: "/opt/conda"
    is_bind: true
    rw: false
    mandatory: false
}

# /usr/lib: Shared libraries needed by native extensions (read-only)
mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
    rw: false
    mandatory: true
}

# /usr/lib64: Additional shared libraries (read-only)
mount {
    src: "/usr/lib64"
    dst: "/usr/lib64"
    is_bind: true
    rw: false
    mandatory: false
}

# /lib: Core libraries and ld-linux (read-only)
mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
    mandatory: true
}

# /lib64: 64-bit loader (read-only)
mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
    mandatory: false
}

# /usr/local/lib: Local libraries (read-only)
mount {
    src: "/usr/local/lib"
    dst: "/usr/local/lib"
    is_bind: true
    rw: false
    mandatory: false
}

# /usr/bin: System binaries (read-only) — needed for locale, etc.
mount {
    src: "/usr/bin"
    dst: "/usr/bin"
    is_bind: true
    rw: false
    mandatory: false
}

# /bin: Core binaries (read-only)
mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    rw: false
    mandatory: false
}

# /etc/alternatives, /etc/fonts, /etc/ssl — needed by Python packages
mount {
    src: "/etc"
    dst: "/etc"
    is_bind: true
    rw: false
    mandatory: false
}

# proc — limited /proc for Python's os.getpid() etc.
mount {
    dst: "/proc"
    fstype: "proc"
    rw: false
    mandatory: true
}

# /dev/null, /dev/urandom — required by Python
mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    rw: false
    mandatory: true
}
mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
    rw: false
    mandatory: true
}
mount {
    src: "/dev/random"
    dst: "/dev/random"
    is_bind: true
    rw: false
    mandatory: false
}

# tmpfs for /tmp inside jail
mount {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
    is_bind: false
    mandatory: true
}

# NOTE: Working directory and script path are added dynamically via CLI
# --bindmount flags (see subprocess_execution_tool.py _build_nsjail_command)

# Seccomp-BPF policy: DENY-LIST approach (default ALLOW)
# Block known-dangerous syscalls; allow all others needed for scientific Python
seccomp_policy_file: "/etc/nsjail/seccomp_scientific.policy"
