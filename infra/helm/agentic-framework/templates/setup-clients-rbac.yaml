apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentic-framework.fullname" . }}-setup-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-framework.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentic-framework.fullname" . }}-secret-manager-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-framework.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentic-framework.fullname" . }}-secret-manager-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentic-framework.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentic-framework.fullname" . }}-secret-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "agentic-framework.fullname" . }}-setup-sa
