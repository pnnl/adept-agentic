# =============================================================================
# AWS MCP Server Manager — Docker Compose
# =============================================================================
# 2 services: meta-MCP server + nginx reverse proxy (HTTP + optional HTTPS)
# Connects to ADEPT via adept_application_network (external)
#
# TLS: If certs/aws_mcp.crt and certs/aws_mcp.key exist, HTTPS is enabled
#       on port 443 (mapped to AWS_MCP_PROXY_HTTPS_PORT). Otherwise HTTP only.
#       Generate certs: AWS_MCP_HOST_IP=<ip> make generate-certs

services:
  # ---------------------------------------------------------------------------
  # Meta-MCP Server — manages AWS MCP server subprocesses
  # ---------------------------------------------------------------------------
  aws_mcp_manager:
    build:
      context: ./aws_mcp_manager
      dockerfile: Dockerfile
    container_name: aws_mcp_manager
    hostname: aws_mcp_manager
    restart: unless-stopped
    environment:
      - AWS_MCP_AWS_ACCESS_KEY_ID=${AWS_MCP_AWS_ACCESS_KEY_ID:-}
      - AWS_MCP_AWS_SECRET_ACCESS_KEY=${AWS_MCP_AWS_SECRET_ACCESS_KEY:-}
      - AWS_MCP_AWS_REGION=${AWS_MCP_AWS_REGION:-us-east-1}
      - AWS_MCP_STS_ROLE_ARN=${AWS_MCP_STS_ROLE_ARN:-}
      - AWS_MCP_STS_SESSION_DURATION=${AWS_MCP_STS_SESSION_DURATION:-3600}
      - AWS_MCP_STS_EXTERNAL_ID=${AWS_MCP_STS_EXTERNAL_ID:-}
      - AWS_MCP_PORT=8003
      - AWS_MCP_SUBPROCESS_TIMEOUT=${AWS_MCP_SUBPROCESS_TIMEOUT:-120}
      - AWS_MCP_MAX_LOADED_SERVERS=${AWS_MCP_MAX_LOADED_SERVERS:-20}
      - AWS_MCP_STS_REFRESH_BUFFER=${AWS_MCP_STS_REFRESH_BUFFER:-300}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8003),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - adept_application_network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy — /mcp and /health (HTTP + conditional HTTPS)
  # ---------------------------------------------------------------------------
  aws_mcp_nginx_proxy:
    image: nginx:alpine
    container_name: aws_mcp_nginx_proxy
    hostname: aws_mcp_nginx_proxy
    restart: unless-stopped
    ports:
      - "${AWS_MCP_PROXY_PORT:-9830}:80"
      - "${AWS_MCP_PROXY_HTTPS_PORT:-9831}:443"
    environment:
      - MCP_SERVER_HOST=aws_mcp_manager
      - MCP_SERVER_PORT=8003
    volumes:
      - ./aws_mcp_proxy.conf.template:/tmp/aws_mcp_proxy.conf.template:ro
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      aws_mcp_manager:
        condition: service_healthy
    # Startup: envsubst the template, conditionally append TLS block if certs exist
    command:
      - /bin/sh
      - -c
      - |
        envsubst '$$MCP_SERVER_HOST $$MCP_SERVER_PORT' \
          < /tmp/aws_mcp_proxy.conf.template \
          > /etc/nginx/conf.d/default.conf

        if [ -f /etc/nginx/ssl/aws_mcp.crt ] && [ -f /etc/nginx/ssl/aws_mcp.key ]; then
          echo "TLS certs found — enabling HTTPS on :443"
          cat >> /etc/nginx/conf.d/default.conf <<'TLSEOF'

        server {
            listen 443 ssl;
            server_name _;

            ssl_certificate     /etc/nginx/ssl/aws_mcp.crt;
            ssl_certificate_key /etc/nginx/ssl/aws_mcp.key;
            ssl_protocols       TLSv1.2 TLSv1.3;
            ssl_prefer_server_ciphers on;

            location /health {
                access_log off;
                return 200 '{"status":"ok","service":"aws-mcp-manager-proxy","tls":true}';
                add_header Content-Type application/json;
            }

            location /mcp {
                proxy_pass http://aws_mcp_manager:8003/mcp;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;

                proxy_http_version 1.1;
                proxy_set_header Connection "";

                proxy_request_buffering off;
                proxy_connect_timeout 60s;
                proxy_send_timeout 600s;
                proxy_read_timeout 600s;
                proxy_buffering off;

                client_max_body_size 50M;
            }

            location / {
                return 404 '{"error":"Not Found","detail":"Use /mcp or /health"}';
                add_header Content-Type application/json;
            }
        }
        TLSEOF
        else
          echo "No TLS certs found — HTTPS disabled (HTTP only on :80)"
        fi

        nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - adept_application_network

networks:
  adept_application_network:
    external: true
