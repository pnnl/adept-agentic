{{- if .Values.redis.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "{{NAME}}-mcp.fullname" . }}-redis-secret
  labels:
    {{- include "{{NAME}}-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | b64enc | quote }}
  {{- else }}
  # Auto-generate Redis password if not provided
  redis-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
