{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-framework.fullname" . }}-keycloak
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "agentic-framework.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: {{ .Values.keycloak.service.type }}
  ports:
    - port: {{ .Values.keycloak.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9000
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "agentic-framework.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
{{- end }}
