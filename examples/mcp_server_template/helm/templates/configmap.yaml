apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "{{NAME}}-mcp.fullname" . }}-nginx-config
  labels:
    {{- include "{{NAME}}-mcp.nginxLabels" . | nindent 4 }}
data:
  default.conf: |
    # Upstream for MCP server
    upstream mcp_backend {
        server {{ include "{{NAME}}-mcp.fullname" . }}-mcp-server:{{ .Values.mcpServer.service.port }};
    }

    # Set trusted proxy CIDR (for Kubernetes internal network)
    set_real_ip_from {{ .Values.nginx.trustedCIDR }};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 80;
        server_name _;

        # Health check endpoint (unrestricted)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # MCP endpoint with IP restriction and SSE streaming
        location /mcp {
            # IP-based access control
            {{- range .Values.nginx.allowedIPs }}
            allow {{ . }};
            {{- end }}
            deny all;

            # Proxy settings for SSE streaming
            proxy_pass http://mcp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE-specific settings
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Timeouts for long-running SSE connections
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;

            # Additional headers
            add_header X-Accel-Buffering no;
        }

        # Root location (catch-all)
        location / {
            # IP-based access control
            {{- range .Values.nginx.allowedIPs }}
            allow {{ . }};
            {{- end }}
            deny all;

            proxy_pass http://mcp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            # Standard timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
